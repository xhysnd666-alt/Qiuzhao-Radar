<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>秋招雷达 · 2027届</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">秋招雷达 <span>2027届</span></div>
      <div class="date muted text-small">今日自动更新 · 数据截至 <span id="data-date"></span></div>
    </header>

    <nav class="tabs" aria-label="页面切换">
      <button class="tab" type="button" data-view-btn="overview" aria-selected="true">总览</button>
      <button class="tab" type="button" data-view-btn="applications" aria-selected="false">我的投递</button>
      <button class="tab" type="button" data-view-btn="feedback" aria-selected="false">反馈池</button>
      <button class="tab" type="button" data-view-btn="review" aria-selected="false">待确认</button>
    </nav>

    <section class="view active" data-view="overview">
      <div class="stats">
        <div class="stat"><b id="stat-active">0</b><span>重点公司在招</span></div>
        <div class="stat"><b id="stat-expiring">0</b><span>即将截止（3天内）</span></div>
        <div class="stat"><b id="stat-early">0</b><span>提前批进行中</span></div>
        <div class="stat"><b id="stat-review">0</b><span>待确认线索</span></div>
      </div>

      <div class="filters">
        <input class="input" id="search" type="search" placeholder="搜索公司 / 岗位…" aria-label="搜索公司或岗位">
        <select class="select" id="filter-industry" aria-label="按行业筛选"></select>
        <select class="select" id="filter-position" aria-label="按岗位方向筛选"></select>
        <select class="select" id="filter-batch" aria-label="按批次筛选">
          <option value="">全部批次</option>
          <option>提前批</option>
          <option>正式批</option>
          <option>补录</option>
        </select>
        <select class="select" id="filter-status" aria-label="按状态筛选"></select>
      </div>

      <div class="table-wrap">
        <table class="table">
          <caption class="sr-only">秋招重点公司列表</caption>
          <thead>
            <tr>
              <th>公司</th>
              <th>岗位方向</th>
              <th>批次</th>
              <th class="hide-sm">开始</th>
              <th class="hide-sm">截止</th>
              <th>状态</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="company-rows"></tbody>
        </table>
      </div>

      <div id="detail" class="panel" hidden></div>
    </section>

    <section class="view" data-view="applications">
      <div class="text-small muted" style="margin-bottom:10px">数据来源：秋招简历投递.xlsx · 你在表格里更新后告诉我，我会同步到这里</div>
      <div class="kanban" id="application-cols"></div>
    </section>

    <section class="view" data-view="feedback">
      <ul class="feedback-list" id="feedback-list"></ul>
    </section>

    <section class="view" data-view="review">
      <div id="review-list"></div>
    </section>

    <footer class="foot muted text-small">
      <span id="source-note"></span>
    </footer>
  </div>

  <script src="data/companies.js"></script>
  <script src="data/applications.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
