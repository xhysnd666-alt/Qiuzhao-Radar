name: Sync Feishu base

on:
  schedule:
    # UTC 16:00 = 北京时间 00:00，每天同步一次
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync Feishu base
        run: node scripts/sync_feishu.mjs
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BASE_TOKEN: ${{ secrets.FEISHU_BASE_TOKEN }}
          FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}

      - name: Commit and push changes
        run: |
          git config user.name "qiuzhao-radar[bot]"
          git config user.email "qiuzhao-radar[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: sync feishu base $(date -u +%Y-%m-%d)"
            git push
          fi
